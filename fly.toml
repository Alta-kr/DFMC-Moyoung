app = "dfmc-moyoung"
primary_region = "nrt"

[build]

[env]
  PORT = "5000"
  NODE_ENV = "production"
  JWT_SECRET = "dfmc_secure_church_jwt_secret_2026"

[mounts]
  source = "dfmc_data"
  destination = "/app/server/data"
  initial_size = "1gb"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
